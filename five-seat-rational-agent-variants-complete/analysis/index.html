<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent-variant confirmation analysis — analysis</title>
  <style>
    :root { color-scheme: light; --ink:#16221d; --muted:#5b6b63; --line:#d7e1db; --accent:#176b4d;
            --warn:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#edf5ef,#f9f6ec); color:var(--ink);
           font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
    main { max-width:1120px; margin:36px auto; padding:0 22px 60px; }
    h1 { font:700 34px/1.15 ui-serif,Georgia,serif; margin:0 0 8px; }
    h2 { font:700 22px/1.2 ui-serif,Georgia,serif; margin:30px 0 12px; }
    h3 { font:700 17px/1.2 ui-sans-serif,system-ui,sans-serif; margin:22px 0 8px; }
    .lede { color:var(--muted); max-width:880px; }
    .card { background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:14px; padding:18px;
            box-shadow:0 8px 24px rgba(29,58,43,.06); overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    th,td { padding:10px 9px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
    th:first-child,td:first-child { text-align:left; white-space:normal; }
    tbody tr:last-child td { border-bottom:0; }
    a { color:var(--accent); font-weight:650; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .links { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
    .links a { display:block; padding:14px; background:white; border:1px solid var(--line); border-radius:10px; }
    .finding { border-left:4px solid var(--accent); padding:12px 16px; background:#eef7f1;
               border-radius:0 10px 10px 0; }
    .warn { border-left:4px solid var(--warn); padding:12px 16px; background:#fdf6ec;
            border-radius:0 10px 10px 0; margin:14px 0; }
    .small { color:var(--muted); font-size:13px; }
    code { font-size:13px; }
</style>
</head>

</html>
